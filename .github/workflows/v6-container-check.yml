# ## Executive summary (read this first)
# Verify the exact frozen V6 commit in an isolated network-free container.
# This job does not alter model code, publish an image, or submit to CodaBench.
name: V6 Frozen Container Check
on:
  push:
    branches: ["validation/v6-container-check"]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: "4612711d429ea4cd43191051c7c23537e1af9364"
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.13"
      - name: Install frozen scorer
        run: |
          pip install 'qfbench2-common @ git+https://github.com/Agenthon-2026/Agenthon2026-public.git@v2.4.2#subdirectory=common'
          pip install 'numpy==2.1.3' 'pandas==2.2.3' 'pyarrow==18.1.0' 'jsonschema==4.23.0'
          pip install --no-deps -e .
      - name: Build exact V6 source
        run: |
          test "$(git rev-parse HEAD)" = "4612711d429ea4cd43191051c7c23537e1af9364"
          docker build --build-arg FORECAST_MODE=v6-full -t t2-v6:verification .
      - name: Offline all-family smoke and byte-identical fallback
        run: |
          mkdir -p /tmp/v6-container
          for unit in t2-F1-greater-confidence-2024 t2-F2-eur-parity-2022 t2-F3-brexit-joint-2016 t2-F4-cpi-vintage-2022; do
            asof=$(python -c "import tomllib; print(tomllib.load(open('units/$unit/card.toml','rb'))['provenance']['data_cutoff'])")
            for mode in text-first-v5.1 v6-full; do
              out="/tmp/v6-container/$unit/$mode"
              mkdir -p "$out"
              chmod 777 "$out"
              docker run --rm --network=none --read-only --tmpfs /tmp:rw,size=512m \
                -e FORECAST_MODE="$mode" -v "$PWD/units/$unit:/input:ro" -v "$out:/output:rw" \
                t2-v6:verification forecast --panels /input --text /input/text --asof "$asof" --out /output/forecast.parquet
              qfbench2-smoke "units/$unit" "$out" --track forecasting
            done
          done
          python - <<'PY'
          import json,pathlib
          count=0
          for path in pathlib.Path('/tmp/v6-container').glob('*/v6-full/forecast_meta.json'):
              meta=json.loads(path.read_text())
              if not meta['rationale']['scenario_integration']['v6_applied']:
                  assert (path.parent/'forecast.parquet').read_bytes() == (path.parent.parent/'text-first-v5.1/forecast.parquet').read_bytes()
                  count+=1
          print('exact fallback files:',count)
          assert count == 4
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v6-frozen-container-report
          path: /tmp/v6-container
          if-no-files-found: warn
          retention-days: 30
