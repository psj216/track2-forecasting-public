# Tail-only Numeric V3 validation. No Docker image is published from this workflow.
# Frozen protocol: 6 cutoffs, 1000 draws, two deterministic seeds.
name: F4 Tail Validation V1

on:
  push:
    branches: ["track2/f4-tail-validation-v1"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.13"

      - name: Install pinned validation runtime
        run: |
          pip install 'qfbench2-common @ https://github.com/Agenthon-2026/Agenthon2026-public/archive/refs/tags/v2.4.4.tar.gz#subdirectory=common'
          pip install 'numpy==2.1.3' 'pandas==2.2.3' 'pyarrow==18.1.0' 'jsonschema==4.23.0' 'ruff==0.4.7' pytest
          pip install --no-deps -e .

      - name: Static checks and unit tests
        run: |
          ruff check qfbench2_track_forecasting/numeric_tail.py backtesting/f4_tail_validation.py tests/test_numeric_tail.py
          ruff format --check qfbench2_track_forecasting/numeric_tail.py backtesting/f4_tail_validation.py tests/test_numeric_tail.py
          python -m pytest -q tests/test_numeric_tail.py

      - name: Run frozen leakage-safe F4 tail protocol
        run: |
          rm -rf "$RUNNER_TEMP/f4-tail-validation"
          python -m backtesting.f4_tail_validation             --root .             --out "$RUNNER_TEMP/f4-tail-validation"             --cutoffs 6             --draws 1000

      - name: Print decision
        run: |
          cat "$RUNNER_TEMP/f4-tail-validation/summary.json"
          python - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "f4-tail-validation"
          result = json.loads((root / "summary.json").read_text())
          if result["decision"] != "CANDIDATE_FOR_NUMERIC_IMAGE":
              print("Tail candidate did not clear the frozen holdout gate; keep Numeric V3.")
          else:
              print("Tail candidate cleared the frozen holdout gate; runtime integration may proceed.")
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: f4-tail-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/f4-tail-validation/
          retention-days: 30
