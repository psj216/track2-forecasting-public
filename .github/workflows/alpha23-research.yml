# Executive summary: isolated original FF03 and independent trained UST engine; no registry operation.
name: Alpha23 paired UST research
on:
  push:
    branches: [track2/final-alpha-23-forward-expectations-engine]
    paths: ['.github/workflows/alpha23-research.yml']
permissions:
  contents: read
  actions: read
jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        chunk: [0,1,2,3]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Agenthon-2026/track2-forecasting-public
          ref: 3b51e16b3f7c0fa0e56bcba323c2bb5e81b8bd56
          path: official
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: psj216/track2-forecasting-public
          run-id: 38798442114
          artifact-ids: 12003002655
          path: ${{ runner.temp }}/ff03-image
          merge-multiple: true
      - name: Restore exact archived safety image
        run: |
          test "$(sha256sum "$RUNNER_TEMP/ff03-image/candidate-image.tar.gz" | cut -d' ' -f1)" = df232487177cb56cb0ae945b2613fbbebbb24eff702f21712662e589d04f636c
          timeout 120 bash -o pipefail -c 'gzip -dc "$RUNNER_TEMP/ff03-image/candidate-image.tar.gz" | docker load'
          docker image inspect sha256:23f226ced859978d7a3f16a23c6d1515a1a3bdb14338297f4818d114bcfa2c1c > "$RUNNER_TEMP/ff03-inspect.json"
      - name: Prepare identical cutoff-safe research inputs
        run: |
          python3 -m venv "$RUNNER_TEMP/prep"
          timeout 120 "$RUNNER_TEMP/prep/bin/pip" install numpy==2.1.3 pandas==2.2.3 pyarrow==18.1.0 beautifulsoup4 lxml
          timeout 240 "$RUNNER_TEMP/prep/bin/python" backtesting/alpha23/acquire.py
          timeout 120 "$RUNNER_TEMP/prep/bin/python" backtesting/alpha23/training_data.py official receipts/alpha23/raw receipts/alpha23/data
          timeout 120 "$RUNNER_TEMP/prep/bin/python" backtesting/alpha23/prepare_inputs.py receipts/alpha23/data receipts/alpha23/inputs
      - name: Frozen paired forecast chunk
        run: timeout 540 python3 backtesting/alpha23/run_docker.py ${{ matrix.chunk }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: alpha23-paired-${{ matrix.chunk }}-${{ github.run_id }}
          path: |
            receipts/alpha23/outputs
            receipts/alpha23/inputs/input-manifest.json
            receipts/alpha23/data/dataset-manifest.json
            ${{ runner.temp }}/ff03-inspect.json
          if-no-files-found: error
          retention-days: 30
