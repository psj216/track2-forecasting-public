# Executive summary: branch-local, anonymous exact-image validation; no build, score or submission.
name: V51 Delivery Emergency11
on:
  push:
    branches:
      - track2/v51-delivery-emergency-11
    paths:
      - .github/workflows/v51-delivery-emergency11.yml
      - backtesting/v51_delivery_emergency11/runner.py
      - backtesting/v51_delivery_emergency11/results/delivery_spec.json
permissions:
  contents: read
jobs:
  validate-exact-image:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: '3.13'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: psj216/track2-forecasting-public
          ref: 47194f28d5188b87cdca1d591d86b9eeda86f7cf
          path: preparation-source
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Agenthon-2026/Agenthon2026-public
          ref: dfa92d242908bba4a448218b9c10ae391238d10d
          path: common242
          persist-credentials: false
      - name: Install validation-only dependencies
        run: python -m pip install numpy==2.1.3 pandas==2.2.3 pyarrow==18.1.0 jsonschema==4.23.0
      - name: Anonymous digest pull, inspection and isolated runtime validation
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/common242/common
          EM11_EVIDENCE: ${{ github.workspace }}/emergency11-evidence
        run: python -m backtesting.v51_delivery_emergency11.runner
      - name: Preserve incremental validation receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v51-delivery-emergency11-${{ github.run_id }}
          path: emergency11-evidence/
          if-no-files-found: error
          retention-days: 30
