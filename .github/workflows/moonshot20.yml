# Executive summary: isolated archived-image Docker A/B, separate raw official scoring, no push.
name: Moonshot20 Single High Risk Candidate
on:
  push:
    branches: [track2/final-moonshot-20-anchor-spike]
    paths:
      - '.github/workflows/moonshot20.yml'
      - 'backtesting/moonshot20/**'
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Agenthon-2026/track2-forecasting-public
          ref: 3b51e16b3f7c0fa0e56bcba323c2bb5e81b8bd56
          path: official-current
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Agenthon-2026/Agenthon2026-public
          ref: 03c50a0036aaf72675d353aef4c7c01ca86d1fcf
          path: common-current
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: psj216/track2-forecasting-public
          run-id: 38798442114
          artifact-ids: 12003002655
          path: ${{ runner.temp }}/ff03-image
          merge-multiple: true
      - name: Verify original archive then build and gate single candidate
        run: timeout 500 python3 backtesting/moonshot20/run.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: moonshot20-${{ github.run_id }}
          path: ${{ runner.temp }}/m20
          if-no-files-found: error
          retention-days: 30
