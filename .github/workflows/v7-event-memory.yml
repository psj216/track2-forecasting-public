# ## Executive summary (read this first)
# Verify the frozen V5.1 fallback, V7 cutoff and Docker contracts. This workflow
# produces research diagnostics; it never publishes an image or uploads to CodaBench.
name: V7 Event Memory Research
on:
  push:
    branches: ["track2/v7-event-memory"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.13"
      - name: Install pinned dependencies
        run: |
          pip install 'qfbench2-common @ git+https://github.com/Agenthon-2026/Agenthon2026-public.git@v2.4.2#subdirectory=common'
          pip install 'numpy==2.1.3' 'pandas==2.2.3' 'pyarrow==18.1.0' 'ruff==0.4.7' pytest
          pip install --no-deps -e .
      - name: Source and cutoff tests
        run: |
          ruff check qfbench2_track_forecasting tests tools/audit_v7.py tools/build_v7_catalog.py
          ruff format --check qfbench2_track_forecasting tests tools/audit_v7.py tools/build_v7_catalog.py
          python -m pytest -q
          python .github/validate_units.py forecasting --stdlib-only
      - name: Inspect public cards and historical replay
        run: |
          python tools/audit_v7.py --out /tmp/v7-a --workers 2 --draws 500 --seed 17 --outer-cases 4
          python tools/audit_v7.py --out /tmp/v7-b --workers 2 --draws 1000 --seed 29 --outer-cases 4
      - name: Build tested image
        run: docker build --build-arg FORECAST_MODE=v7-f2 -t t2-v7:research .
      - name: Smoke all families and compare frozen outputs
        run: |
          mkdir -p /tmp/v7-smoke
          for unit in t2-F1-greater-confidence-2024 t2-F2-time-has-come-2024 t2-F3-brexit-joint-2016 t2-F4-cpi-vintage-2022; do
            asof=$(python -c "import tomllib; print(tomllib.load(open('units/$unit/card.toml','rb'))['provenance']['data_cutoff'])")
            for mode in text-first-v5.1 v7-f2; do
              out="/tmp/v7-smoke/$unit/$mode"
              mkdir -p "$out"
              chmod 777 "$out"
              docker run --rm --network=none --read-only --tmpfs /tmp:rw,size=512m \
                -e FORECAST_MODE="$mode" -v "$PWD/units/$unit:/input:ro" -v "$out:/output:rw" \
                t2-v7:research forecast --panels /input --text /input/text --asof "$asof" --out /output/forecast.parquet
              qfbench2-smoke "units/$unit" "$out" --track forecasting
            done
          done
          python - <<'PY'
          import pathlib
          for unit in ('t2-F1-greater-confidence-2024','t2-F3-brexit-joint-2016','t2-F4-cpi-vintage-2022'):
              root=pathlib.Path('/tmp/v7-smoke')/unit
              assert (root/'v7-f2/forecast.parquet').read_bytes() == (root/'text-first-v5.1/forecast.parquet').read_bytes()
          PY
      - name: Report candidate gate without publishing
        run: |
          python - <<'PY'
          import json,pathlib
          a=json.loads(pathlib.Path('/tmp/v7-a/audit.json').read_text())
          b=json.loads(pathlib.Path('/tmp/v7-b/audit.json').read_text())
          print('V7 F2 release candidate:', a['release_candidate'] and b['release_candidate'])
          print('Seed 17:', a['outer'], a['quarter_clusters'])
          print('Seed 29:', b['outer'], b['quarter_clusters'])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v7-research-${{ github.run_id }}
          path: |
            /tmp/v7-a/
            /tmp/v7-b/
          if-no-files-found: warn
          retention-days: 30
