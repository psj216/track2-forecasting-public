# ## Executive summary (read this first)
# Audit the static event catalog, nested historical selection, all public cards,
# and Docker execution. Publish only if two independent robustness runs pass.
# This workflow never uploads to CodaBench.
name: V6 Full Candidate
on:
  push:
    branches: ["track2/v6-full-event-engine"]
  pull_request:
    branches: ["track2/v6-f2-event-analog"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v6-full-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.13"
      - name: Install pinned dependencies
        run: |
          pip install 'qfbench2-common @ git+https://github.com/Agenthon-2026/Agenthon2026-public.git@v2.4.2#subdirectory=common'
          pip install 'numpy==2.1.3' 'pandas==2.2.3' 'pyarrow==18.1.0' 'ruff==0.4.7' pytest
          pip install --no-deps -e .
      - name: Test cutoff and family contracts
        run: |
          ruff check qfbench2_track_forecasting tests tools/audit_v6.py tools/backtest_v6.py
          ruff format --check qfbench2_track_forecasting tests tools/audit_v6.py tools/backtest_v6.py
          python -m pytest
          python .github/validate_units.py forecasting --stdlib-only
      - name: Catalog, all-unit and nested outer validation
        run: |
          python tools/audit_v6.py --out /tmp/v6-a --workers 2 --seed 17 --draws 500
          python tools/backtest_v6.py --out /tmp/v6-a --workers 2 --seed 17 --draws 500 --cases 2
          python tools/audit_v6.py --out /tmp/v6-b --workers 2 --seed 29 --draws 1000
          python tools/backtest_v6.py --out /tmp/v6-b --workers 2 --seed 29 --draws 1000 --cases 2
      - name: Build the tested image
        run: docker build --build-arg FORECAST_MODE=v6-full -t t2-v6:candidate .
      - name: Smoke all families and check exact rejected-head fallback
        run: |
          mkdir -p /tmp/v6-smoke
          for unit in t2-F1-greater-confidence-2024 t2-F2-eur-parity-2022 t2-F3-brexit-joint-2016 t2-F4-cpi-vintage-2022; do
            asof=$(python -c "import tomllib; print(tomllib.load(open('units/$unit/card.toml','rb'))['provenance']['data_cutoff'])")
            for mode in text-first-v5.1 v6-full; do
              out="/tmp/v6-smoke/$unit/$mode"
              mkdir -p "$out"
              chmod 777 "$out"
              docker run --rm --network=none --read-only --tmpfs /tmp:rw,size=512m \
                -e FORECAST_MODE="$mode" -v "$PWD/units/$unit:/input:ro" -v "$out:/output:rw" \
                t2-v6:candidate forecast --panels /input --text /input/text --asof "$asof" --out /output/forecast.parquet
              qfbench2-smoke "units/$unit" "$out" --track forecasting
            done
          done
          python - <<'PY'
          import json, pathlib
          for path in pathlib.Path('/tmp/v6-smoke').glob('*/v6-full/forecast_meta.json'):
              meta=json.loads(path.read_text())
              if not meta['rationale']['scenario_integration']['v6_applied']:
                  assert (path.parent/'forecast.parquet').read_bytes() == (path.parent.parent/'text-first-v5.1/forecast.parquet').read_bytes()
          PY
      - name: Decide release eligibility
        id: gate
        run: |
          python - <<'PY'
          import json,os,pathlib
          a=json.loads(pathlib.Path('/tmp/v6-a/outer.json').read_text())
          b=json.loads(pathlib.Path('/tmp/v6-b/outer.json').read_text())
          active_a=json.loads(pathlib.Path('/tmp/v6-a/audit.json').read_text())['active']
          active_b=json.loads(pathlib.Path('/tmp/v6-b/audit.json').read_text())['active']
          passed=a['release_candidate'] and b['release_candidate'] and min(active_a,active_b)>0
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f'publish={str(passed).lower()}\n')
          print('V6 RELEASE_CANDIDATE =',passed)
          PY
      - name: Publish qualified image and verify anonymous pull
        if: steps.gate.outputs.publish == 'true'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DOCKERHUB_TOKEN"
          auth=$(mktemp -d)
          anonymous=$(mktemp -d)
          trap 'rm -rf -- "$auth" "$anonymous"' EXIT
          printf '%s' "$DOCKERHUB_TOKEN" | docker --config "$auth" login docker.io -u jotj216 --password-stdin
          unset DOCKERHUB_TOKEN
          tag="docker.io/jotj216/track2-f4-approved:v6-${GITHUB_SHA:0:7}-${GITHUB_RUN_ID}"
          tested=$(docker inspect -f '{{.Id}}' t2-v6:candidate)
          docker tag t2-v6:candidate "$tag"
          docker --config "$auth" push "$tag"
          ref=$(docker inspect "$tag" --format '{{index .RepoDigests 0}}')
          docker --config "$anonymous" pull "$ref"
          test "$(docker inspect -f '{{.Id}}' "$ref")" = "$tested"
          printf '%s\n' "$ref" > /tmp/v6-a/image-reference.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v6-report-${{ github.run_id }}
          path: |
            /tmp/v6-a/
            /tmp/v6-b/
          if-no-files-found: error
          retention-days: 30
