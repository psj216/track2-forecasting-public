# Build and publish the Numeric V3 + frozen F4 tail candidate after 500-draw robustness.
name: F4 Tail Candidate V1

on:
  push:
    branches: ["track2/f4-tail-candidate-v1"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.13"

      - name: Install pinned runtime
        run: |
          pip install 'qfbench2-common @ https://github.com/Agenthon-2026/Agenthon2026-public/archive/refs/tags/v2.4.4.tar.gz#subdirectory=common'
          pip install 'numpy==2.1.3' 'pandas==2.2.3' 'pyarrow==18.1.0' 'jsonschema==4.23.0' 'ruff==0.4.7' pytest
          pip install --no-deps -e .

      - name: Static checks and unit tests
        run: |
          ruff check qfbench2_track_forecasting/numeric_tail.py backtesting/f4_tail_validation.py tests/test_numeric_tail.py
          python -m pytest -q tests/test_numeric_tail.py

      - name: Require frozen 0.85/0.85 pair to survive at 500 draws
        run: |
          python - <<'PY'
          from pathlib import Path
          from backtesting.f4_tail_validation import (
              SEEDS, assign_splits, eligible, evaluate, opportunities, paired_metrics, summarize
          )
          from qfbench2_track_forecasting.numeric_tail import calibrate_single_cell_tails

          pair=(0.85,0.85)
          items=opportunities(Path('.'),6)
          assign_splits(items)
          for split in ('select','holdout'):
              rows=[]
              for item in items:
                  if item.split != split or not eligible(item):
                      continue
                  for salt in SEEDS:
                      base,y,components,_=evaluate(item,500,salt)
                      cand=calibrate_single_cell_tails(base,*pair)
                      rows.append({
                          'identity':item.identity,
                          'cutoff':item.cutoff,
                          'seed':salt,
                          **paired_metrics(cand,y,components),
                      })
              report=summarize(rows)
              print(split, report)
              if not report['pass']:
                  raise SystemExit(f'500-draw frozen tail pair failed {split}: {report}')
          PY

      - name: Build baseline and candidate images
        run: |
          docker build --pull --build-arg FORECAST_MODE=numeric --build-arg F4_TAIL_CALIBRATION=off -t t2-tail:baseline .
          docker build --build-arg FORECAST_MODE=numeric --build-arg F4_TAIL_CALIBRATION=on -t t2-tail:candidate .

      - name: Smoke F1-F4 and verify only eligible F4 changes
        run: |
          set -euo pipefail
          python - <<'PY' > "$RUNNER_TEMP/units.txt"
          import pathlib,tomllib
          for unit in ('t2-F1-greater-confidence-2024','t2-F2-eur-parity-2022',
                       't2-F3-brexit-joint-2016','t2-F4-short-vol-2018'):
              card=tomllib.loads((pathlib.Path('units')/unit/'card.toml').read_text())
              print(unit+'|'+card['provenance']['data_cutoff'])
          PY
          while IFS='|' read -r unit asof; do
            for mode in baseline candidate; do
              out="$RUNNER_TEMP/tail-smoke/$unit/$mode"
              mkdir -p "$out"; chmod 0777 "$out"
              docker run --rm --network=none --read-only --tmpfs /tmp                 -v "$PWD/units/$unit:/input:ro" -v "$out:/output"                 "t2-tail:$mode" forecast --panels /input --text /input/text                 --asof "$asof" --out /output/forecast.parquet
              qfbench2-smoke "units/$unit" "$out" --track forecasting
            done
          done < "$RUNNER_TEMP/units.txt"
          python - <<'PY'
          import json,os,pathlib,pandas as pd
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'tail-smoke'
          for unit in ('t2-F1-greater-confidence-2024','t2-F2-eur-parity-2022','t2-F3-brexit-joint-2016'):
              a=pd.read_parquet(root/unit/'baseline/forecast.parquet')
              b=pd.read_parquet(root/unit/'candidate/forecast.parquet')
              pd.testing.assert_frame_equal(a,b,check_exact=True)
          unit='t2-F4-short-vol-2018'
          a=pd.read_parquet(root/unit/'baseline/forecast.parquet')
          b=pd.read_parquet(root/unit/'candidate/forecast.parquet')
          assert not a.equals(b)
          meta=json.loads((root/unit/'candidate/forecast_meta.json').read_text())
          assert meta['numeric_tail_calibration']['applied'] is True
          assert meta['numeric_tail_calibration']['lower_factor'] == 0.85
          assert meta['numeric_tail_calibration']['upper_factor'] == 0.85
          PY

      - name: Publish candidate and verify anonymous pull
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DOCKERHUB_TOKEN"
          printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io -u jotj216 --password-stdin
          tag="docker.io/jotj216/track2-f4-approved:tail-v1-${GITHUB_SHA:0:7}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          tested_id=$(docker inspect -f '{{.Id}}' t2-tail:candidate)
          docker tag t2-tail:candidate "$tag"
          docker push "$tag"
          published=$(docker inspect "$tag" --format '{{json .RepoDigests}}' | jq -er '.[0]')
          digest="${published##*@}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          image_ref="docker.io/jotj216/track2-f4-approved@$digest"
          anon_config=$(mktemp -d)
          docker --config "$anon_config" pull "$image_ref"
          test "$(docker inspect -f '{{.Id}}' "$image_ref")" = "$tested_id"
          test "$(docker inspect -f '{{ index .Config.Labels "qfbench2.forecast_mode" }}' "$image_ref")" = numeric
          test "$(docker inspect -f '{{ index .Config.Labels "qfbench2.f4_tail_calibration" }}' "$image_ref")" = on
          mkdir -p candidate-artifacts
          printf '%s\n' "$image_ref" > candidate-artifacts/image-reference.txt
          printf '%s\n' "$GITHUB_SHA" > candidate-artifacts/source-commit.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: f4-tail-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-artifacts/
          if-no-files-found: error
          retention-days: 30
