# ## Executive summary (read this first)
# Branch-scoped Phase 2 smoke test on a real F4 shock/tail practice unit with a log-return target.
# It leaves the reference forecaster unchanged and verifies sample tails plus the official admissibility gates.

name: Phase 2 F4 Practice Smoke

on:
  push:
    branches: ["task/reference-docker-smoke"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  f4-practice-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Show immutable source revision
        run: |
          git rev-parse HEAD
          git status --short

      - name: Build unmodified reference image
        run: docker build --pull -t t2-reference:phase2-f4 .

      - name: Run real F4 tail unit fully offline
        run: |
          rm -rf .phase2-f4-out
          mkdir -p .phase2-f4-out
          # The image runs as uid 1000; reproduce the harness contract where /output is writable.
          chmod 0777 .phase2-f4-out
          docker run --rm --network=none \
            -v "$PWD/units/t2-F4-short-vol-2018:/input:ro" \
            -v "$PWD/.phase2-f4-out:/output" \
            t2-reference:phase2-f4 \
            forecast \
              --panels /input/panels/ \
              --text /input/text/ \
              --asof 2018-01-26 \
              --out /output/forecast.parquet

      - name: Verify required deliverables
        run: |
          test -s .phase2-f4-out/forecast.parquet
          test -s .phase2-f4-out/forecast_meta.json
          test -s .phase2-f4-out/forecast_rationale.md
          ls -lh .phase2-f4-out
          cat .phase2-f4-out/forecast_meta.json

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.13"

      - name: Install pinned scorer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "qfbench2-common @ https://github.com/Agenthon-2026/Agenthon2026-public/archive/refs/tags/v2.3.1.tar.gz#subdirectory=common"
          pip install .

      - name: Inspect F4 log-return and tail contract
        run: |
          python - <<'PY'
          import json
          import pandas as pd

          df = pd.read_parquet('.phase2-f4-out/forecast.parquet')
          meta = json.load(open('.phase2-f4-out/forecast_meta.json'))

          print(df.dtypes)
          print('rows', len(df))
          print('draws', df['draw'].nunique())
          print('assets', sorted(df['asset'].unique().tolist()))
          print('horizons', sorted(df['horizon'].unique().tolist()))

          s = df['value']
          qs = s.quantile([0.01, 0.05, 0.50, 0.95, 0.99])
          print('summary')
          print(s.describe())
          print('tail quantiles')
          print(qs)
          print('skew', s.skew())
          print('kurtosis', s.kurt())

          assert list(df.columns) == ['draw', 'asset', 'horizon', 'value']
          assert len(df) == 500
          assert df['draw'].nunique() == 500
          assert set(df['asset']) == {'MKT'}
          assert set(df['horizon']) == {21}
          assert df['value'].notna().all()
          assert not df.duplicated(['draw', 'asset', 'horizon']).any()
          assert s.nunique() > 100
          assert qs.loc[0.01] < qs.loc[0.05] < qs.loc[0.50] < qs.loc[0.95] < qs.loc[0.99]

          assert meta['unit_id'] == 't2-F4-short-vol-2018'
          assert meta['asof'] == '2018-01-26'
          assert meta['asset_ids'] == ['MKT']
          assert meta['horizons'] == [21]
          assert meta['n_draws'] == 500
          assert meta['target'] == 'log_return'
          PY

      - name: Run official local admissibility gates
        run: |
          python scoring/scoring.py score \
            --card units/t2-F4-short-vol-2018/card.toml \
            --forecast .phase2-f4-out/forecast.parquet
