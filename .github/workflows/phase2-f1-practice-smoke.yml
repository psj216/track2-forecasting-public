# ## Executive summary (read this first)
# Branch-scoped Phase 2 smoke test on a real F1 practice/validation unit.
# It leaves the reference forecaster unchanged and proves the Docker contract works beyond the exemplar.

name: Phase 2 F1 Practice Smoke

on:
  push:
    branches: ["task/reference-docker-smoke"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  f1-practice-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Show immutable source revision
        run: |
          git rev-parse HEAD
          git status --short

      - name: Build unmodified reference image
        run: docker build --pull -t t2-reference:phase2 .

      - name: Run real F1 unit fully offline
        run: |
          rm -rf .phase2-out
          mkdir -p .phase2-out
          # The image runs as uid 1000; reproduce the harness contract where /output is writable.
          chmod 0777 .phase2-out
          docker run --rm --network=none \
            -v "$PWD/units/t2-F1-greater-confidence-2024:/input:ro" \
            -v "$PWD/.phase2-out:/output" \
            t2-reference:phase2 \
            forecast \
              --panels /input/panels/ \
              --text /input/text/ \
              --asof 2024-01-31 \
              --out /output/forecast.parquet

      - name: Verify required deliverables
        run: |
          test -s .phase2-out/forecast.parquet
          test -s .phase2-out/forecast_meta.json
          test -s .phase2-out/forecast_rationale.md
          ls -lh .phase2-out
          cat .phase2-out/forecast_meta.json

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.13"

      - name: Install pinned scorer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "qfbench2-common @ https://github.com/Agenthon-2026/Agenthon2026-public/archive/refs/tags/v2.3.1.tar.gz#subdirectory=common"
          pip install .

      - name: Inspect F1 forecast contract
        run: |
          python - <<'PY'
          import json
          import pandas as pd

          df = pd.read_parquet('.phase2-out/forecast.parquet')
          meta = json.load(open('.phase2-out/forecast_meta.json'))

          print(df.dtypes)
          print('rows', len(df))
          print('draws', df['draw'].nunique())
          print('assets', sorted(df['asset'].unique().tolist()))
          print('horizons', sorted(df['horizon'].unique().tolist()))
          print('value summary')
          print(df.groupby('horizon')['value'].agg(['mean', 'std', 'min', 'max']))

          assert list(df.columns) == ['draw', 'asset', 'horizon', 'value']
          assert len(df) == 500 * 1 * 2
          assert df['draw'].nunique() == 500
          assert set(df['asset']) == {'UST_2Y'}
          assert set(df['horizon']) == {126, 189}
          assert df['value'].notna().all()
          assert meta['unit_id'] == 't2-F1-greater-confidence-2024'
          assert meta['asof'] == '2024-01-31'
          assert meta['asset_ids'] == ['UST_2Y']
          assert meta['horizons'] == [126, 189]
          assert meta['n_draws'] == 500
          assert meta['target'] == 'level'
          PY

      - name: Run official local admissibility gates
        run: |
          python scoring/scoring.py score \
            --card units/t2-F1-greater-confidence-2024/card.toml \
            --forecast .phase2-out/forecast.parquet
